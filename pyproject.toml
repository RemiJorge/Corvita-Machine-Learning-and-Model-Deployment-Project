[project]
name = "icu-mortality"
version = "0.7.0"
description = "ICU in-hospital mortality prediction from first 24 hours (PhysioNet 2012 set A)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scikit-learn",
    "joblib",
    "fastapi",
    "uvicorn",
    "pydantic",
    "pyyaml",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "ruff",
    "matplotlib",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/icu"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "data: tests that require the real PhysioNet dataset",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]

[tool.ruff.format]
quote-style = "double"
